name: Deploy Firestore rules

# JEN ruční spuštění s potvrzením "ANO". Nasazení pravidel zůstává výslovně na uživateli.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Napiš přesně ANO pro nasazení Firestore pravidel'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-rules
  cancel-in-progress: false

jobs:
  confirm:
    name: Potvrzení
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Kontrola potvrzení
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "ANO" ]; then
            echo "::error::Nasazení pravidel vyžaduje potvrzení: do pole confirm napiš přesně ANO"
            exit 1
          fi

  ci:
    name: CI
    needs: confirm
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Nasazení pravidel
    needs: [confirm, ci]
    if: github.ref == 'refs/heads/main' && github.repository == 'adamstencl/LifePocket'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Firebase CLI
        run: npm install -g firebase-tools@15

      # Klíč servisního účtu jde do dočasného souboru mimo repo (jen pro vlastníka), po běhu se maže
      - name: Přihlášení servisním účtem
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Chybí secret FIREBASE_SERVICE_ACCOUNT (postup je v docs/GITHUB-ACTIONS.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Nasazení pravidel
        run: firebase deploy --only firestore:rules --project lifepocket-d8f0e --non-interactive

      - name: Smazání klíče
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json"
